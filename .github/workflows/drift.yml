name: Upstream drift
on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: drift
  cancel-in-progress: true
jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run sync:check
        run: npm run sync:check 2>&1 | tee "$RUNNER_TEMP/report.txt"
      - name: Detect drift
        id: detect
        run: |
          # sync:check always exits 0; it prints these exact lines when nothing changed.
          if grep -qF '(no source changes)' "$RUNNER_TEMP/report.txt" && grep -qF 'no measurement changes' "$RUNNER_TEMP/report.txt"; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Open or update issue
        if: steps.detect.outputs.drift == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_PATH: ${{ runner.temp }}/report.txt
        with:
          script: |
            const fs = require('fs')
            const title = 'Upstream drift detected'
            let report = fs.readFileSync(process.env.REPORT_PATH, 'utf8').replace(/\x1b\[[0-9;]*m/g, '')
            const max = 60000
            if (report.length > max) report = report.slice(0, max) + '\n… (truncated; see the workflow run log)'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `Detected by [workflow run](${run}) on \`${context.sha.slice(0, 7)}\` (${context.eventName}).\n\n` +
              '```\n' + report + '\n```\n\n' +
              'Nothing was committed. To reproduce: `npm run sync:check`, review `git diff`, discard with `git checkout -- src measurements`.'
            const { owner, repo } = context.repo
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', per_page: 100 })
            const existing = issues.find((i) => !i.pull_request && i.title === title)
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body })
              core.info(`Updated #${existing.number}`)
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body })
              core.info(`Created #${created.data.number}`)
            }
